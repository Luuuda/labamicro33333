version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
      - ./config-secrets:/config-secrets

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app
    ports:
      - "8080:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=app
    depends_on:
      - config-server

  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    container_name: catalog
    ports:
      - "8081:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=catalog
    depends_on:
      - config-server

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8082:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=gateway
    depends_on:
      - config-server

  reviews:
    build:
      context: .
      dockerfile: reviews/Dockerfile
    container_name: reviews
    ports:
      - "8083:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=reviews
    depends_on:
      - config-server

  users:
    build:
      context: .
      dockerfile: users/Dockerfile
    container_name: users
    ports:
      - "8084:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=users
    depends_on:
      - config-server