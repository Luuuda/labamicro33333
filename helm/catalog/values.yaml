# Значення за замовчуванням = середовище розробки (dev)

replicaCount: 1

image:
  repository: catalog
  # якщо порожньо — береться appVersion з Chart.yaml
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# перевизначення імен (необов'язково)
nameOverride: ""
fullnameOverride: ""

strategy:
  maxSurge: 1
  maxUnavailable: 0

containerPort: 8080

service:
  type: NodePort
  port: 8080
  # порожньо — Kubernetes призначить nodePort автоматично
  # (так чарт можна встановити двічі в один кластер)
  nodePort: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Параметри конфігурації застосунку -> ConfigMap -> змінні оточення
config:
  greeting: "Привіт з Helm-чарта (dev)!"
  featureFlagNewSearch: "false"
  environment: "dev"
  actuatorExposure: "health,info,metrics,prometheus"
  healthProbesEnabled: "true"
  rabbitHealthEnabled: "false"

# Чутливі параметри -> Secret. Тут лише навчальні значення!
# Реальні значення передаються через --set під час встановлення.
secret:
  dbPassword: "dev-password"
  apiSecretKey: "dev-api-key"

ingress:
  enabled: false
  className: nginx
  host: catalog.local
  path: /
  pathType: Prefix

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  # порожньо — StorageClass за замовчуванням (у minikube: standard)
  storageClass: ""
  mountPath: /data

# Хук pre-upgrade (пункт 9b)
hooks:
  preUpgrade:
    enabled: true
    image: busybox:1.36

# Тест релізу (helm test)
tests:
  enabled: true
  image: busybox:1.36
