apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog.fullname" . }}-config
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
data:
  CATALOG_GREETING: {{ .Values.config.greeting | quote }}
  CATALOG_FEATURE_FLAG_NEW_SEARCH: {{ .Values.config.featureFlagNewSearch | quote }}
  INFO_APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: {{ .Values.config.actuatorExposure | quote }}
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: {{ .Values.config.healthProbesEnabled | quote }}
  MANAGEMENT_HEALTH_RABBIT_ENABLED: {{ .Values.config.rabbitHealthEnabled | quote }}
