apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog.fullname" . }}-secret
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ required "secret.dbPassword is required" .Values.secret.dbPassword | b64enc | quote }}
  API_SECRET_KEY: {{ required "secret.apiSecretKey is required" .Values.secret.apiSecretKey | b64enc | quote }}
