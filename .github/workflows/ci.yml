name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    # зміни GitOps-конфігурації (ЛР5) не запускають збірку образів
    paths-ignore:
      - "bootstrap/**"
      - "argocd-apps/**"
      - "charts/**"
      - "helm/**"
      - "k8s/**"
      - "**/*.md"
      - "**/*.docx"
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, catalog, config-server, gateway, reviews, users]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build service
        run: mvn -pl ${{ matrix.service }} clean package -DskipTests -am

      - name: Run Tests
        run: mvn -pl ${{ matrix.service }} test -am

      - name: Static Code Analysis (Checkstyle)
        run: mvn -pl ${{ matrix.service }} org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check -Dcheckstyle.config.location=checkstyle.xml

  build-and-push-images:
    needs: build-test-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, catalog, config-server, gateway, reviews, users]
      fail-fast: false
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image (Locally for PR, or for push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
