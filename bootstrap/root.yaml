# Кореневий Application (app-of-apps). Застосовується вручну ОДИН раз:
#   kubectl apply -f bootstrap/root.yaml
# Далі Argo CD сам стежить за каталогом argocd-apps/ у Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Luuuda/labamicro33333.git
    targetRevision: main
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
