server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:///config-repo/
            - file:///config-secrets/

encrypt:
  key: "this-is-my-symmetric-encryption-key-for-spring-cloud-config-2026"

management:
  endpoints:
    web:
      exposure:
        include: health, info