# не менше 4 реплік, щоб було видно співвідношення версій (25/50/75%)
replicaCount: 4

# ЛР6: поступовий реліз через Argo Rollouts (canary, кроки — у values.yaml)
rollout:
  enabled: true

# зламане оновлення стає Degraded через 2 хв, а не через 10
progressDeadlineSeconds: 120

image:
  repository: ghcr.io/luuuda/catalog
  tag: "1.2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  greeting: "Привіт з Argo CD!"
  featureFlagNewSearch: "true"
  environment: "minikube-gitops"

existingSecret: catalog-secret

ingress:
  enabled: false

hooks:
  preUpgrade:
    enabled: false
tests:
  enabled: false
