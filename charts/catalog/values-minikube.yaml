replicaCount: 2

image:
  repository: ghcr.io/luuuda/catalog
  tag: "9.9.9"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  greeting: "Привіт з Argo CD!"
  featureFlagNewSearch: "true"
  environment: "minikube-gitops"

existingSecret: catalog-secret

ingress:
  enabled: false

hooks:
  preUpgrade:
    enabled: false
tests:
  enabled: false
