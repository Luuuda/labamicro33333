# ЛР7: 5 реплік — canary 20% = 1 под з 5
replicaCount: 5

# ЛР6/ЛР7: canary через Argo Rollouts; рішення приймає аналіз за метриками
rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="pipay",uri!~"/actuator.*"'
  canary:
    steps:
      - setWeight: 20
      - pause: {duration: 30s}      # дати метрикам накопичитися
      - analysis:
          templates:
            - templateName: catalog-success-rate
      - setWeight: 60
      - pause: {duration: 30s}

# ЛР7: метрики, дашборд і алерт
metrics:
  enabled: true
  alerts: true

# ЛР7: частка штучних помилок 500 (0 — справна версія, 0.5 — погана)
env:
  - name: FAIL_RATE
    value: "0.5"

# 5 подів Spring Boot стартують одночасно — даємо більше часу до першої liveness-проби
probes:
  liveness:
    initialDelaySeconds: 90

# скільки чекати готовності нових подів, перш ніж вважати реліз невдалим
progressDeadlineSeconds: 300

image:
  repository: ghcr.io/luuuda/catalog
  tag: "1.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  greeting: "Привіт з Argo CD!"
  featureFlagNewSearch: "true"
  environment: "minikube-gitops"

existingSecret: catalog-secret

ingress:
  enabled: false

hooks:
  preUpgrade:
    enabled: false
tests:
  enabled: false
