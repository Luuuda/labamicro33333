{{- if .Values.metrics.alerts }}
# ЛР7 (п. d): алерт, якщо понад 5% відповідей — 5xx протягом 1 хв.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "catalog.fullname" . }}-alerts
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  groups:
    - name: catalog
      rules:
        - alert: CatalogHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",uri!~"/actuator.*",status=~"5.."}[1m]))
            / sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",uri!~"/actuator.*"}[1m])) > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "catalog: більше 5% відповідей 5xx"
{{- end }}
