{{- if .Values.tests.enabled }}
# Тест релізу: запускається командою helm test.
# Перевіряє readiness застосунку та що відповідь містить очікуване середовище з values.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "catalog.fullname" . }}-test-connection
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          URL=http://{{ include "catalog.fullname" . }}:{{ .Values.service.port }}
          echo "health:"; wget -qO- $URL{{ .Values.probes.readiness.path }} | tee /tmp/h; echo
          grep -q '"UP"' /tmp/h
          echo "config:"; wget -qO- $URL/api/v1/catalog/config | tee /tmp/c; echo
          grep -q '"environment":"{{ .Values.config.environment }}"' /tmp/c
          echo "TEST PASSED"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
{{- end }}
