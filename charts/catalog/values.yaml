# Значення за замовчуванням = середовище розробки (dev)

replicaCount: 1

image:
  repository: catalog
  # якщо порожньо — береться appVersion з Chart.yaml
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# перевизначення імен (необов'язково)
nameOverride: ""
fullnameOverride: ""

# Скільки секунд Kubernetes чекає на успішне оновлення,
# після чого Deployment (і застосунок в Argo CD) стає Degraded
progressDeadlineSeconds: 600

strategy:
  maxSurge: 1
  maxUnavailable: 0

rollout:
  enabled: false
  # ЛР7: автоматичний аналіз релізу за метриками Prometheus
  analysis:
    enabled: false
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="default"'
  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 75
      - pause: {duration: 30s}

containerPort: 8080

service:
  type: NodePort
  port: 8080
  nodePort: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Параметри конфігурації застосунку -> ConfigMap -> змінні оточення
config:
  greeting: "Привіт з Helm-чарта (dev)!"
  featureFlagNewSearch: "false"
  environment: "dev"
  actuatorExposure: "health,info,metrics,prometheus"
  healthProbesEnabled: "true"
  rabbitHealthEnabled: "false"
  # ЛР7: у stdout — лише текст повідомлення (JSON-рядок запиту)
  logPattern: "%m%n"

# ЛР7: додаткові змінні оточення контейнера (наприклад FAIL_RATE)
env: []

# ЛР7: метрики для Prometheus
metrics:
  enabled: false
  path: /actuator/prometheus
  alerts: false

# Якщо задано — Secret з чарта не створюється, а Deployment бере
# вже існуючий Secret з цим ім'ям (створений вручну, поза Git).
existingSecret: ""

# Чутливі параметри -> Secret. Тут лише навчальні значення!
# Реальні значення передаються через --set під час встановлення.
# У Git паролів немає: або existingSecret, або --set secret.dbPassword=...
secret:
  dbPassword: ""
  apiSecretKey: ""

ingress:
  enabled: false
  className: nginx
  host: catalog.local
  path: /
  pathType: Prefix

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  # порожньо — StorageClass за замовчуванням (у minikube: standard)
  storageClass: ""
  mountPath: /data

# Хук pre-upgrade (пункт 9b)
hooks:
  preUpgrade:
    enabled: true
    image: busybox:1.36

# Тест релізу (helm test)
tests:
  enabled: true
  image: busybox:1.36
